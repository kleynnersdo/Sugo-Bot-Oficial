plugins {
    id 'com.android.application'
}

android {
    namespace 'com.latinbot.sugo'
    compileSdk 34 // O la versión que tengas configurada

    defaultConfig {
        applicationId "com.latinbot.sugo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}